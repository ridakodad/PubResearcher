# Page d'accueil publiée sur GitHub Pages (branche gh-pages), sous https://ridakodad.github.io/pubresearcher/.
# Vercel reste possible (landing/vercel.json) ; cette publication-ci ne demande aucun jeton.
name: Page d'accueil

on:
  workflow_dispatch:
  push:
    branches: [landing]
    paths: ['landing/**', '.github/workflows/site.yml']

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b --noEmit
      - name: Compilation sous /pubresearcher/
        env:
          VITE_SITE_URL: https://ridakodad.github.io/pubresearcher
        run: npx vite build --base /pubresearcher/
      - name: Routes de l'application (GitHub Pages n'a pas de réécriture)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publication sur gh-pages
        working-directory: landing/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Page d'accueil ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
